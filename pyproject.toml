[project]
name = "cyclops-code"
version = "0.1.0"
description = "A coding agent for your terminal, built on cyclops-ai"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "cyclops-ai>=0.1.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "httpx>=0.27.0",
    "pathspec>=0.12.0",
]

[project.scripts]
cyclops = "cyclops_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclops_code"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

