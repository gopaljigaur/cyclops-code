name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          PUBLISHED=$(curl -sf https://pypi.org/pypi/cyclops-code/json \
            | python -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" \
            2>/dev/null || echo "0.0.0")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          [ "$CURRENT" != "$PUBLISHED" ] && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: uv sync --no-sources

      - name: Build
        if: steps.version_check.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version_check.outputs.changed == 'true'
        run: uv publish

      - name: Create GitHub release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version_check.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v$VERSION"
          git push origin "v$VERSION" --force
          gh release create "v$VERSION" \
            dist/* \
            --title "v$VERSION" \
            --generate-notes
