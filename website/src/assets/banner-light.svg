<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="200" fill="#ffffff" rx="12"/>

  <!-- outer ring -->
  <circle cx="196" cy="100" r="46" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <!-- iris -->
  <circle cx="196" cy="100" r="28" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <!-- pupil -->
  <circle cx="196" cy="100" r="14" fill="#58a6ff"/>
  <!-- shine -->
  <circle cx="204" cy="90" r="5" fill="#cce7ff" opacity="0.85"/>

  <!-- wordmark -->
  <text
    x="272" y="116"
    font-family="'Courier New', Courier, monospace"
    font-size="68"
    font-weight="700"
    letter-spacing="-1"
  ><tspan fill="#58a6ff">cyclops</tspan><tspan fill="#24292f"> code</tspan></text>

  <!-- tagline -->
  <text
    x="279" y="170"
    font-family="'Courier New', Courier, monospace"
    font-size="17"
    fill="#57606a"
    letter-spacing="0.5"
  >a coding agent for your terminal</text>
</svg>
